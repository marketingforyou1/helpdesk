<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Ozvena – chat widget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C66}a:hover{color:#095C4C}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 420px; height: 760px; box-sizing: border-box; padding: 20px; background: #E9ECEF; font-family: Manrope, system-ui, sans-serif; color: #111827; display: flex; flex-direction: column; align-items: flex-end; gap: 16px">

  <section aria-label="Chat so zákazníckou podporou" style="width: 380px; flex: 1; min-height: 0; background: #FFFFFF; border-radius: 18px; box-shadow: 0 12px 40px rgba(17,24,39,0.18); display: flex; flex-direction: column; overflow: hidden">
    <div style="background: {{accent}}; color: #FFFFFF; padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex">
          <div style="width: 36px; height: 36px; border-radius: 50%; background: #FDE68A; color: #78350F; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; border: 2px solid {{accent}}">ZK</div>
          <div style="width: 36px; height: 36px; border-radius: 50%; background: #BFDBFE; color: #1E3A8A; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; border: 2px solid {{accent}}; margin-left: -10px">MR</div>
          <div style="width: 36px; height: 36px; border-radius: 50%; background: #FBCFE8; color: #831843; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; border: 2px solid {{accent}}; margin-left: -10px">AP</div>
        </div>
        <button type="button" aria-label="Minimalizovať chat" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: rgba(255,255,255,0.15); color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
      </div>
      <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.01em">Dobrý deň, ako vám pomôžeme?</div>
      <div style="font-size: 13px; display: flex; align-items: center; gap: 8px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #A7F3D0"></span> Sme online · zvyčajne odpovedáme do 2 minút
      </div>
    </div>

    <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #F9FAFB">
      <div style="text-align: center; font-size: 12px; color: #4B5563">Dnes 9:41</div>
      <sc-for list="{{messages}}" as="m" hint-placeholder-count="3">
        <div style="{{m.wrap}}">
          <div style="{{m.bubble}}">{{m.text}}</div>
        </div>
      </sc-for>
      <sc-if value="{{showQuick}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end">
          <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
            <button type="button" onClick="{{q.pick}}" style="min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{accent}}; background: #FFFFFF; color: #0B5F4F; font-size: 13px; font-weight: 600; cursor: pointer">{{q.label}}</button>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{typing}}" hint-placeholder-val="{{ false }}">
        <div style="font-size: 12px; color: #4B5563">Zuzana píše…</div>
      </sc-if>
    </div>

    <form onSubmit="{{send}}" style="display: flex; align-items: center; gap: 6px; padding: 10px 10px 10px 14px; border-top: 1px solid #E5E7EB">
      <label style="flex: 1">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Napíšte správu</span>
        <input type="text" value="{{draft}}" onChange="{{type}}" placeholder="Napíšte správu…" style="width: 100%; box-sizing: border-box; border: 0; outline: none; font-size: 14px; color: #111827; background: transparent; height: 44px">
      </label>
      <button type="button" aria-label="Priložiť súbor" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: #4B5563; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"></path></svg>
      </button>
      <button type="submit" aria-label="Odoslať" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: {{accent}}; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"></path></svg>
      </button>
    </form>
    <div style="text-align: center; font-size: 11px; color: #4B5563; padding: 0 0 10px">Beží na Ozvena</div>
  </section>

  <button type="button" aria-label="Zavrieť chat" style="width: 60px; height: 60px; border-radius: 50%; border: 0; background: {{accent}}; color: #FFFFFF; box-shadow: 0 8px 24px rgba(17,24,39,0.25); cursor: pointer; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0E7C66","options":["#0E7C66","#1D4ED8","#C2410C","#6D28D9"]},"$preview":{"width":420,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '',
      typing: false,
      msgs: [
        { me: false, text: 'Ahoj! Som Zuzana zo zákazníckej podpory. S čím vám môžem pomôcť?' }
      ]
    };
  }
  push(text) {
    if (!text.trim()) return;
    this.setState({ msgs: [...this.state.msgs, { me: true, text }], draft: '', typing: true });
    setTimeout(() => {
      this.setState({ typing: false, msgs: [...this.state.msgs, { me: false, text: 'Ďakujem, pozriem sa na to. Môžete mi prosím poslať číslo objednávky?' }] });
    }, 1400);
  }
  renderVals() {
    const accent = this.props.accent ?? '#0E7C66';
    const messages = this.state.msgs.map((m) => ({ ...m,
      wrap: `display: flex; justify-content: ${m.me ? 'flex-end' : 'flex-start'}`,
      bubble: `max-width: 260px; padding: 10px 13px; font-size: 14px; line-height: 1.45; border-radius: 14px; ${m.me ? `background: ${accent}; color: #FFFFFF; border-bottom-right-radius: 4px` : 'background: #FFFFFF; color: #111827; border: 1px solid #E5E7EB; border-bottom-left-radius: 4px'}` }));
    return {
      accent, messages,
      draft: this.state.draft,
      typing: this.state.typing,
      showQuick: this.state.msgs.length === 1,
      quick: ['Kde je moja objednávka?', 'Vrátenie tovaru', 'Faktúra'].map((label) => ({ label, pick: () => this.push(label) })),
      type: (e) => this.setState({ draft: e.target.value }),
      send: (e) => { e.preventDefault(); this.push(this.state.draft); }
    };
  }
}
</script>
</body>
</html>
