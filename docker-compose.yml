services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ozvena
      POSTGRES_PASSWORD: ozvena
      POSTGRES_DB: ozvena
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  pgdata:
